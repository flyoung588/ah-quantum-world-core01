name: Core02 cross-system quantum runtime once
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quantum-core02-once
  cancel-in-progress: false
jobs:
  core:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build fixed isolated environment, no persistent cache
        run: timeout --kill-after=5s 150s docker build --pull --no-cache --build-arg BASE_IMAGE=python@sha256:2ed6491b93cd49272ee6de2b5a38440c3448360322c089fc23e370722d74179d -f core02/Dockerfile -t core02:once .
      - name: One bounded quantum dynamics run
        run: python3 -B core02/host_run.py
      - name: Preserve actual complete or partial evidence
        if: always()
        run: python3 -B core02/export_logs.py "$RUNNER_TEMP/core02-results"
