<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Quantum World Core-02</title><style>__STYLE__</style>
<main><h1>Quantum World · Core-02</h1><p>同一网格波函数运行内核，不同物理模型与边界</p>
<section class="control"><label>物理系统 <select id="system"><option value="H2">H₂ Molecular Vibration</option><option value="H3">H₃ Collinear Collision</option></select></label><button id="prepare">按输入制备</button><button id="play">启动</button><button id="pause">暂停</button><button id="step">推进4步</button><button id="fork">独立分叉</button><button id="kick">模型允许的相位操作</button><button id="compare">比较</button><button id="export">导出实际状态</button></section>
<section><label>可修改的运行时初态 JSON <textarea id="input" rows="4" style="width:95%"></textarea></label><details><summary>允许操作与物理边界</summary><pre id="allowed"></pre><pre id="model"></pre></details><p id="error"></p></section>
<div class="grid"><section style="flex:1"><canvas id="density" width="600" height="400"></canvas><p id="labels"></p><small>显示随实际波函数更新；纵向/颜色按当前最大密度缩放。不是预制动画，也不是完整三维电子云。</small></section><section style="flex:1"><pre id="obs"></pre><pre id="comparison"></pre></section></div>
<section><p>每帧最多2个dt=.25au时间步；到本轮验证时域自动暂停。新初态与控制会真实计算，但并不自动继承收敛认证。H₂使用发表的离散BO数据插值，不能作为精密光谱预测；H₃区域占据不是反应产率。浏览器数值核与Python短时比对不等于视觉验收。</p></section></main>
<script type="application/json" id="payload">__PAYLOAD__</script><script>__FFT__</script><script>__RUNTIME__</script><script>
const models=JSON.parse(document.getElementById('payload').textContent),makers={H2:h2Adapter,H3:h3Adapter},$=x=>document.getElementById(x),ctx=$('density').getContext('2d');let world,branch=null,running=false,frames=0;
function draw(){world.adapter.plot(world,ctx);$('obs').textContent=JSON.stringify(world.observe(),null,2);}
function protect(f){return()=>{try{f();$('error').textContent='';}catch(e){running=false;$('error').textContent=e.message;}};}
function choose(){running=false;branch=null;world=new LiveWorld(makers[$('system').value](models[$('system').value]));window.quantumWorld=world;$('input').value=JSON.stringify(world.p.initial,null,2);$('allowed').textContent=JSON.stringify(world.p.allowed,null,2);$('model').textContent=JSON.stringify(world.p.metadata,null,2);$('labels').textContent=world.adapter.labels;$('comparison').textContent='';draw();}
$('system').onchange=protect(choose);$('prepare').onclick=protect(()=>{running=false;world.prepare(JSON.parse($('input').value));draw();});$('play').onclick=()=>running=true;$('pause').onclick=()=>{running=false;draw();};$('step').onclick=protect(()=>{running=false;world.step(.25,4);draw();});$('fork').onclick=()=>{branch=world.fork();$('comparison').textContent='已保存独立量子状态分叉';};$('kick').onclick=protect(()=>{world.apply(world.adapter.kick);draw();});$('compare').onclick=protect(()=>{$('comparison').textContent=branch?JSON.stringify(world.compare(branch),null,2):'请先分叉；不同时刻会明确标记';});$('export').onclick=()=>{running=false;const b=new Blob([JSON.stringify(world.export_evidence())],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='core02-actual-state.json';a.click();URL.revokeObjectURL(a.href);};
function frame(){if(running){try{world.step(.25,2);if(++frames%4===0)draw();if(world.t>=models[$('system').value].validated_duration_au){running=false;draw();}}catch(e){running=false;$('error').textContent=e.message;}}requestAnimationFrame(frame);}choose();requestAnimationFrame(frame);
</script></html>
